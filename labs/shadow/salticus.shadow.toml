# Vzorová konfigurace pracovního prostoru pro shadow režim (jen pozorování). Presety v kódu
# se nemění; přepínače se zapínají tady.
# Spuštění: SALTICUS_KNOWN_ACTIVITY=known_activity.json salticus-program beh spust ...
#
# Oprava 26. 11. 2026 (nezávislý přezkum): tento komentář dřív tvrdil "nic se nezavírá ani
# neblokuje", ale `close_gate = false` sám o sobě auto-zavírání nevypíná — žebřík má vlastní,
# méně striktní cestu (`ladder_closes`), která běží ve výchozím stavu, dokud auditní fail-safe
# nezjistí problém. `observe_only = true` níže to teď skutečně vynucuje (vlastní přepínač,
# krok 47): vše jde člověku, nic se automaticky nezavře ani nevyvrátí, nezávisle na `close_gate`
# a na stavu auditu. Aktivní enforcement (blokování) je oddělený a vyžaduje
# `SALTICUS_ENFORCEMENT_MODE=enforce`, ten tu zůstává vypnutý (výchozí je dry-run).
workspace_root = "./workspace"

[engine]
mode = "v3"

[engine.v3]
observe_only = true
# krok 27: opakovaná krátká spojení na přihlašovací službu (hádání hesel)
attempts = true
# přiřazení zdrojů i nespárovaným událostem: nový útočník na už zobrazené službě se zobrazí
attr_calib = true
# objem hosta i přes klouzavý horizont oken: útok, který protne hranici okna
upload_horizon = true
# krok 31: odchozí skenování (aspoň 25 cílů bez odpovědi za 5 minut); potvrzeno jen na datech,
# ze kterých vzniklo, na skutečné domácí síti 1 zásah za 3 dny; proto zatím vypnuto
# outscan = true
# krok 33 až 38: korelace do incidentů (jen anotace, nic nezavírá ani neskrývá). Pro 14denní
# soak (K16 v plan-korelace-final.md); výchozí profil v kódu se nemění. Vyžaduje case_files.
case_files = true
# čas nálezu, jedna událost na nález, seskupení v2, čítače zahozených, stabilní klíč, souhrn dne
corr_v2 = true
# kauzální seskupení a sdílený vnější protějšek s mezí hubu; související incidenty s důvodem
corr_v3 = true
corr_ext = true
corr_related = true
